  .lost__code{
    font-family:var(--font-display); font-size:12px; letter-spacing:.3em; text-transform:uppercase;
    color:var(--amber); margin:0 0 20px;
  }
  .lost p.lede{ max-width:44ch; margin-inline:auto }
